<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Médiathèque</title>
<style>
:root{--nuit:#191A4A;--nuit2:#2A2C74;--ink:#17183F;--focus:#FFD84D;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:1.25vw}
html{font-size:min(calc(100vw / 80), calc(100vh / 45));background:var(--nuit)}
body{background:var(--nuit);color:#fff;font-family:"Baloo 2","Nunito","Arial Rounded MT Bold","Trebuchet MS",Roboto,system-ui,"Segoe UI",sans-serif;font-weight:800;overflow-x:hidden}
body.inplayer{overflow:hidden}
body.inplayer #app{display:none}
button{font:inherit;color:inherit;border:0;background:none;text-align:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
img{display:block}

/* En-tête */
.top{position:sticky;top:0;z-index:5;background:var(--nuit);padding:2rem 4rem 1.2rem;display:flex;align-items:center;flex-wrap:wrap;gap:1rem 2rem}
.top h1{font-size:3rem;line-height:1.1;font-weight:900}
.top h1 small{font-size:1.4rem;font-weight:700;opacity:.7;margin-left:.8rem}
.hints{margin-left:auto;display:flex;gap:1rem;font-size:1.1rem;font-weight:700}
.hints span{margin-left:1rem;background:var(--nuit2);padding:.45rem 1rem;border-radius:2rem}
.back{margin-right:2rem;padding:.8rem 1.7rem;border-radius:2rem;background:var(--nuit2);font-size:1.5rem}
.chips{display:flex;flex-wrap:wrap;width:100%}
.chip{margin:0 .7rem .7rem 0;min-width:3rem;padding:.45rem 1.1rem;border-radius:2rem;background:var(--nuit2);font-size:1.15rem;text-align:center}

/* Grilles */
.page{padding:1.7rem 4rem 5rem}
.page h2{font-size:1.8rem;margin:0 0 1rem}
.page section+section{margin-top:2.6rem}
.grid{display:grid;gap:1.6rem}
.cols{grid-template-columns:repeat(5,1fr)}
.cont,.eps{grid-template-columns:repeat(4,1fr)}
.films{grid-template-columns:repeat(6,1fr)}

/* Focus commun : la tuile "saute" et reçoit un double anneau */
.tile,.film,.ep,.chip,.page section{scroll-margin-top:var(--hh,0px)}
.tile,.film,.ep,.chip,.back,.btns button{transition:transform .12s ease,box-shadow .12s ease,background-color .12s ease}
.tile:focus,.film:focus,.ep:focus,.chip:focus,.back:focus,.btns button:focus{transform:translateY(-.35rem) scale(1.06);position:relative;z-index:3;box-shadow:0 0 0 .3rem var(--nuit),0 0 0 .6rem var(--focus),0 1rem 0 rgba(0,0,0,.35)}
.chip:focus,.back:focus{background:var(--focus);color:var(--ink)}

/* Collections */
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;min-height:11rem;padding:1rem;border-radius:1.6rem;background:var(--c);color:var(--ink);text-align:center;box-shadow:0 .45rem 0 rgba(0,0,0,.35)}
.tile .emo{font-size:4rem;line-height:1}
.tile .nm{font-size:1.6rem;line-height:1.1;font-weight:900}
.tile .ct{font-size:1.05rem;font-weight:700;opacity:.75}

/* Épisodes */
.ep{position:relative;display:flex;flex-direction:column;border-radius:1.4rem;background:var(--nuit2);box-shadow:0 .4rem 0 rgba(0,0,0,.3);overflow:hidden;min-height:6rem}
.ep .row{display:flex;align-items:center;gap:1.1rem;padding:1rem 1.3rem;flex:1}
.ep .num{flex:none;margin-right:1.1rem;display:grid;place-items:center;width:3.6rem;height:3.6rem;border-radius:50%;background:var(--c);color:var(--ink);font-size:1.5rem;font-weight:900}
.ep .num.s{font-size:1.15rem}
.ep .et{font-size:1.3rem;line-height:1.15;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ep .et em{display:block;font-style:normal;font-size:1rem;font-weight:700;opacity:.75}
.ep img{width:100%;height:9.5rem;object-fit:cover;background:#000}
.ep:focus{background:var(--c);color:var(--ink)}
.ep:focus .num{background:var(--ink);color:var(--c)}

/* Films */
.film{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;height:16rem;padding:1rem;border-radius:1.3rem;overflow:hidden;background:var(--c);color:var(--ink);text-align:center;box-shadow:0 .4rem 0 rgba(0,0,0,.35)}
.film .emo{font-size:3.2rem;line-height:1}
.film .ft{font-size:1.25rem;line-height:1.1;font-weight:900;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.film img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.film.art .ft{position:absolute;left:0;right:0;bottom:0;padding:2.4rem .8rem .7rem;background:linear-gradient(transparent,rgba(10,10,40,.92));color:#fff;font-size:1rem;-webkit-line-clamp:2}

/* Vu / progression */
.seen{position:absolute;top:.6rem;right:.7rem;display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:#3DDB7A;color:var(--ink);font-style:normal;font-size:1.2rem;font-weight:900;z-index:2}
.bar{position:absolute;left:0;right:0;bottom:0;height:.55rem;background:rgba(0,0,0,.4);z-index:2}
.bar i{display:block;height:100%;background:var(--focus)}

/* Lecteur */
#player{position:fixed;top:0;right:0;bottom:0;left:0;background:#000;z-index:20}
#player[hidden]{display:none}
#v{width:100%;height:100%;object-fit:contain;background:#000}
#hud{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;opacity:0;transition:opacity .25s;background:linear-gradient(rgba(0,0,0,.7),transparent 24%,transparent 66%,rgba(0,0,0,.85))}
#hud.on{opacity:1}
#hud .top2{position:absolute;top:2.5rem;left:4rem;right:4rem}
#psub{font-size:1.3rem;font-weight:700;opacity:.8}
#ptitle{font-size:2.4rem;line-height:1.15;font-weight:900}
#hud .bot{position:absolute;left:4rem;right:4rem;bottom:3rem}
#pbar{height:.8rem;border-radius:1rem;background:rgba(255,255,255,.3);overflow:hidden}
#pbar i{display:block;height:100%;width:0;background:var(--focus)}
#hud .row2{display:flex;justify-content:space-between;margin-top:.8rem;font-size:1.3rem;font-weight:700}
#flash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:4.5rem;padding:1rem 2.4rem;border-radius:2rem;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;white-space:nowrap}
#flash.go{animation:fl .8s ease-out}
@keyframes fl{0%{opacity:1;transform:translate(-50%,-50%) scale(.9)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}
#wait{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:2.2rem;padding:1rem 2.4rem;border-radius:2rem;background:rgba(0,0,0,.65);display:none}
#wait.on{display:block}
#panel{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;background:rgba(10,10,40,.86)}
#panel[hidden]{display:none}
#panel .card{background:var(--nuit);border-radius:2rem;padding:2.5rem 3rem;min-width:36rem;max-width:54rem;text-align:center}
#panel h2{font-size:2.5rem;line-height:1.15}
#panel p{font-size:1.4rem;font-weight:700;opacity:.85;margin-top:.8rem}
.btns{display:flex;flex-direction:column;margin-top:1.8rem}
.btns button{margin-bottom:1.1rem;padding:1.1rem 2rem;border-radius:1.4rem;background:var(--nuit2);font-size:1.6rem;text-align:center;box-shadow:0 .35rem 0 rgba(0,0,0,.35)}
.btns button.main{background:var(--focus);color:var(--ink)}
.btns button:focus{background:#fff;color:var(--ink)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>

<div id="player" hidden>
  <video id="v" playsinline></video>
  <div id="hud">
    <div class="top2"><div id="psub"></div><div id="ptitle"></div></div>
    <div class="bot">
      <div id="pbar"><i></i></div>
      <div class="row2"><span id="ptime"></span><span>◀ ▶ 10 s · OK pause · ▲ ▼ menu · Retour : la liste</span></div>
    </div>
  </div>
  <div id="flash"></div>
  <div id="wait">Chargement…</div>
  <div id="panel" hidden></div>
</div>

  try { if (replace) history.replaceState({ d }, '', h); else history.pushState({ d: d + 1 }, '', h); }
  catch (e) { if (replace) location.replace(h); else location.hash = h; }
  route();
}
function back() {
  if (history.state && history.state.d > 0) history.back();
  else if (cur.v != null) nav({ c: cur.c }, true);
  else if (cur.c != null) nav({}, true);
}
function route() {
  const h = location.hash;
  if (h === lastHash) return;
  lastHash = h;
  rememberFocus();
  cur = parseHash();
  if (cur.v != null && COLS[cur.c] && COLS[cur.c].items[cur.v]) { startPlayer(cur.c, cur.v); return; }
  stopPlayer();
  if (cur.c != null && COLS[cur.c]) renderCol(cur.c); else { cur = { c: null, v: null }; renderHome(); }
}
addEventListener('popstate', route);
addEventListener('hashchange', route);

function rememberFocus() {
  if (!view || inPlayer) return;
  const a = document.activeElement;
  mem[view] = { k: a && a.dataset ? a.dataset.k : null, y: scrollY };
}
function syncHeaderHeight() {
  const h = app.querySelector('.top');
  document.documentElement.style.setProperty('--hh', h ? (h.offsetHeight + 14) + 'px' : '0px');
}
function focusEl(el, scroll) {
  if (!el) return;
  el.focus({ preventScroll: true });
  if (scroll !== false) el.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'auto' });
}
function restoreFocus(defEl) {
  const m = mem[view];
  let el = m && m.k ? app.querySelector('[data-k="' + m.k + '"]') : null;
  if (el) { scrollTo(0, m.y); focusEl(el, false); }
  else { scrollTo(0, 0); focusEl(defEl || app.querySelector('[data-f]'), false); }
}

/* ---- Écrans ---- */
const colorOf = (ci) => PAL[ci % PAL.length];
function barHtml(p) {
  return isSeen(p) ? '<i class="seen">✓</i>' : (frac(p) > 0.02 ? '<i class="bar"><i style="width:' + Math.round(frac(p) * 100) + '%"></i></i>' : '');
}
function continueItems() {
  const out = [];
  for (const p in PR) {
    const r = PR[p];
    if (!r.v && r.t > 15 && BYPATH[p]) out.push({ u: r.u || 0, ci: BYPATH[p][0], ii: BYPATH[p][1] });
  }
  return out.sort((a, b) => b.u - a.u).slice(0, 4);
}
function renderHome() {
  view = 'home'; document.title = 'Médiathèque';
  const cont = continueItems();
  const GROUPS = [...new Set(COLS.map(c => c.g))];
  const tileHtml = (c, ci) =>
    `<button class="tile" data-f data-k="c${ci}" data-act="col" data-i="${ci}"${ci === COLS.findIndex(x => x.g === c.g) ? ' data-grp="' + GROUPS.indexOf(c.g) + '"' : ''} style="--c:${colorOf(ci)}">` +
    `<span class="emo">${c.emoji}</span><span class="nm">${esc(c.name)}</span><span class="ct">${c.items.length} vidéo${c.items.length > 1 ? 's' : ''}</span></button>`;
  const sections = GROUPS.map(g => '<section>' + (g ? '<h2>' + esc(g) + '</h2>' : '') + '<div class="grid cols">' +
    COLS.map((c, ci) => c.g === g ? tileHtml(c, ci) : '').join('') + '</div></section>').join('');
  const gchips = GROUPS.length > 1 ? '<div class="chips">' + GROUPS.map((g, gi) =>
    `<button class="chip" data-f data-k="g${gi}" data-act="jumpg" data-g="${gi}">${esc(g)}</button>`).join('') + '</div>' : '';
  const contHtml = cont.length ? '<section><h2>On continue ?</h2><div class="grid cont">' + cont.map(o => {
    const c = COLS[o.ci], it = c.items[o.ii];
    return `<button class="ep" data-f data-k="r${o.ci}-${o.ii}" data-act="play" data-c="${o.ci}" data-i="${o.ii}" style="--c:${colorOf(o.ci)}">` +
      `<span class="row"><span class="num">${c.emoji}</span><span class="et"><em>${esc(c.name)}</em>${esc(it.t)}</span></span>${barHtml(it.p)}</button>`;
  }).join('') + '</div></section>' : '';
  app.innerHTML = '<header class="top"><h1>🍿 Médiathèque</h1>' + (NATIVE ? '<button class="back" data-f data-k="settings" data-act="settings" style="margin-left:auto">⚙ Réseau</button>' : '<div class="hints"><span>◀ ▲ ▼ ▶ choisir</span><span>OK regarder</span><span>Retour</span></div>') + gchips + '</header>' +
    '<div class="page">' + contHtml + sections + '</div>';
  syncHeaderHeight();
  restoreFocus(app.querySelector(cont.length ? '.cont [data-f]' : '.tile'));
}
function resumeIdx(ci) {
  const items = COLS[ci].items; let best = -1, u = 0;
  items.forEach((it, i) => { const r = PR[it.p]; if (r && (r.u || 0) > u) { u = r.u; best = i; } });
  if (best < 0) return 0;
  return (PR[items[best].p].v && best + 1 < items.length) ? best + 1 : best;
}
function renderCol(ci) {
  const c = COLS[ci]; view = 'c' + ci; document.title = c.name + ' · Médiathèque';
  const films = c.kind === 'films';
  const multiSeason = new Set(c.items.filter(i => i.s > 0).map(i => i.s)).size > 1;
  const cards = c.items.map((it, ii) => {
    const k = `data-f data-k="v${ci}-${ii}" data-act="play" data-c="${ci}" data-i="${ii}"`;
    if (films) {
      const col = PAL[hash(it.t) % PAL.length];
      return it.a
        ? `<button class="film art" ${k} style="--c:${col}"><img loading="lazy" alt="" src="${esc(vurl(it.a))}"><span class="ft">${esc(it.t)}</span>${barHtml(it.p)}</button>`
        : `<button class="film" ${k} style="--c:${col}"><span class="emo">${c.emoji}</span><span class="ft">${esc(it.t)}</span>${barHtml(it.p)}</button>`;
    }
    const num = it.e || c.emoji, small = String(num).length > 2 ? ' s' : '';
    const sub = (multiSeason && it.s > 0 && it.e && !it.sl) ? `<em>Saison ${it.s}</em>` : '';
    return `<button class="ep" ${k} style="--c:${colorOf(ci)}">` +
      (it.a ? `<img loading="lazy" alt="" src="${esc(vurl(it.a))}">` : '') +
      `<span class="row"><span class="num${small}">${num}</span><span class="et">${sub}${esc(it.t)}${it.d ? '<em>' + esc(it.d) + '</em>' : ''}</span></span>${barHtml(it.p)}</button>`;
  }).join('');
  const chips = c.chips.length ? '<div class="chips">' + c.chips.map(k => `<button class="chip" data-f data-k="j${k.i}-${esc(k.l)}" data-act="jump" data-i="${k.i}">${esc(k.l)}</button>`).join('') + '</div>' : '';
  app.innerHTML = `<header class="top"><button class="back" data-f data-k="back" data-act="back">← Retour</button>` +
    `<h1>${c.emoji} ${esc(c.name)}<small>${c.items.length} vidéo${c.items.length > 1 ? 's' : ''}</small></h1>${chips}</header>` +
    `<div class="page"><div class="grid ${films ? 'films' : 'eps'}">${cards}</div></div>`;
  syncHeaderHeight();
  const def = app.querySelector('[data-k="v' + ci + '-' + (c.kind === 'serie' ? resumeIdx(ci) : 0) + '"]');
  restoreFocus(def);
}
app.addEventListener('error', e => {
  if (e.target.tagName !== 'IMG') return;
  const card = e.target.closest('.film,.ep'); e.target.remove();
  if (card) card.classList.remove('art');
}, true);
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'col') nav({ c: +b.dataset.i });
  else if (a === 'play') nav({ c: +b.dataset.c, v: +b.dataset.i });
  else if (a === 'back') back();
  else if (a === 'settings') Android.settings();
  else if (a === 'jumpg') {
    const tile = app.querySelector('[data-grp="' + b.dataset.g + '"]');
    if (tile) { focusEl(tile, false); const sec = tile.closest('section'); if (sec) sec.scrollIntoView({ block: 'start', behavior: 'auto' }); }
  }
  else if (a === 'jump') focusEl(app.querySelector('[data-k="v' + cur.c + '-' + b.dataset.i + '"]'), true);
});

/* ---- Lecteur ---- */
let wdT = 0, PL = null, panelOpen = false, panelCfg = null, hudT = 0, lastSave = 0, ended = false;
const flashEl = $('#flash'), waitEl = $('#wait');
function flash(t) { flashEl.textContent = t; flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go'); }
function showHud() {
  hud.classList.add('on'); clearTimeout(hudT);
  if (!V.paused && !panelOpen) hudT = setTimeout(() => hud.classList.remove('on'), 4000);
}
function savePos() {
  if (!PL) return;
  const it = COLS[PL.c].items[PL.i], d = V.duration, t = V.currentTime;
  if (!isFinite(d) || d <= 0 || t < 1) return;
  const was = PR[it.p] && PR[it.p].v;
  PR[it.p] = { t: Math.floor(t), d: Math.floor(d), u: Date.now(), v: !!was || t / d > 0.92 };
  persist(); lastSave = Date.now();
}
function startPlayer(ci, ii) {
  if (NATIVE) {
    const it = COLS[ci].items[ii];
    const r = PR[it.p];
    Android.play(vurl(it.p), (COLS[ci].name + ' \u2013 ' + it.t + (it.d ? ' \u00b7 ' + it.d : '')));
    if (r) { r.u = Date.now(); persist(); } else { PR[it.p] = { t: 0, d: 0, u: Date.now(), v: false }; persist(); }
    setTimeout(back, 60);
    return;
  }
  if (inPlayer) savePos();
  closePanel();
  inPlayer = true; ended = false; document.body.classList.add('inplayer'); player.hidden = false;
  PL = { c: ci, i: ii };
  const c = COLS[ci], it = c.items[ii];
  $('#psub').textContent = c.emoji + ' ' + c.name + (it.e ? ' · ' + (it.s ? (it.sl || 'Saison ' + it.s) + ' · ' : '') + 'Épisode ' + it.e : '');
  $('#ptitle').textContent = /^Épisode \d+$/.test(it.t) ? '' : it.t;
  $('#pbar i').style.width = '0'; $('#ptime').textContent = '';
  waitEl.classList.add('on');
  PL.ok = false; clearTimeout(wdT);
  V.src = vurl(it.p); V.load();
  tryPlay();
  const me = PL; wdT = setTimeout(() => { if (PL === me && !me.ok) showFail('Aucune image après 10 secondes.', true); }, 10000);
  showHud();
}
function tryPlay() {
  const p = V.play();
  if (p && p.catch) p.catch(err => {
    if (PL && err && err.name === 'NotAllowedError' && !panelOpen) showPanel({ title: 'Prêt !', onBack: back, btns: [
      { label: '▶ Lancer la vidéo', main: true, fn: () => { closePanel(); tryPlay(); } }, listBtn() ] });
  });
}
function extUrl(p) {
  const u = new URL(vurl(p), location.href);
  if (/Android/i.test(navigator.userAgent) && /^https?:$/.test(u.protocol))
    return 'intent://' + u.host + u.pathname + u.search + '#Intent;scheme=' + u.protocol.slice(0, -1) + ';action=android.intent.action.VIEW;type=video/*;end';
  return u.href;
}
function openExt() { if (!PL) return; V.pause(); location.href = extUrl(COLS[PL.c].items[PL.i].p); }
function stopPlayer() {
  if (!inPlayer) return;
  savePos(); clearTimeout(hudT); clearTimeout(wdT);
  V.pause(); V.removeAttribute('src'); V.load();
  closePanel(); player.hidden = true; document.body.classList.remove('inplayer');
  inPlayer = false; PL = null; waitEl.classList.remove('on');
}
const hasNext = () => PL && PL.i + 1 < COLS[PL.c].items.length;
const hasPrev = () => PL && PL.i > 0;
const goNext = () => { if (hasNext()) nav({ c: PL.c, v: PL.i + 1 }, true); };
const goPrev = () => { if (hasPrev()) nav({ c: PL.c, v: PL.i - 1 }, true); };

function showPanel(cfg) {
  panelOpen = true; panelCfg = cfg; clearTimeout(hudT); hud.classList.remove('on');
  panelEl.innerHTML = '<div class="card"><h2>' + esc(cfg.title) + '</h2>' + (cfg.msg ? '<p>' + esc(cfg.msg) + '</p>' : '') +
    '<div class="btns">' + cfg.btns.map((b, k) => `<button data-f data-b="${k}" class="${b.main ? 'main' : ''}">${esc(b.label)}</button>`).join('') + '</div></div>';
  panelEl.hidden = false; focusEl(panelEl.querySelector('button'), false);
}
function closePanel() { panelOpen = false; panelCfg = null; panelEl.hidden = true; panelEl.innerHTML = ''; }
panelEl.addEventListener('click', e => { const b = e.target.closest('[data-b]'); if (b && panelCfg) panelCfg.btns[+b.dataset.b].fn(); });

function listBtn() { return { label: '☰ Retour à la liste', fn: back }; }
function nextBtn(main) { return hasNext() ? { label: '▶ Vidéo suivante', main, fn: goNext } : null; }
function openMenu() {
  if (panelOpen) return;
  V.pause();
  const resume = () => { closePanel(); const p = V.play(); if (p && p.catch) p.catch(() => {}); };
  showPanel({ title: 'Pause', onBack: resume, btns: [
    { label: '▶ Continuer', main: true, fn: resume },
    hasNext() && { label: '⏭ Vidéo suivante', fn: goNext },
    hasPrev() && { label: '⏮ Vidéo précédente', fn: goPrev },
    { label: '🔗 Ouvrir avec un autre lecteur', fn: openExt },
    listBtn() ].filter(Boolean) });
}
function showEnd() {
  const it = COLS[PL.c].items[PL.i];
  showPanel({ title: 'C’est fini !', onBack: back, btns: [
    nextBtn(true),
    { label: '↺ Revoir', main: !hasNext(), fn: () => { closePanel(); ended = false; V.currentTime = 0; const p = V.play(); if (p && p.catch) p.catch(() => {}); } },
    listBtn() ].filter(Boolean) });
}
function showFail(msg, soft) {
  if (panelOpen || !PL) return;
  clearTimeout(wdT); waitEl.classList.remove('on');
  const it = COLS[PL.c].items[PL.i], ext = it.p.split('.').pop().toLowerCase();
  const code = V.error ? ' Code ' + V.error.code + '.' : '';
  const h265 = V.canPlayType('video/mp4; codecs="hvc1.1.6.L93.B0"') ? 'oui' : 'non';
  showPanel({ title: 'Cette vidéo ne se lance pas ici',
    msg: (msg || 'Fichier introuvable ou format non pris en charge (.' + ext + ').') + code + ' [H.265 : ' + h265 + ']',
    onBack: back, btns: [
    { label: '🔗 Ouvrir avec un autre lecteur', main: true, fn: openExt },
    soft && { label: '▶ Continuer ici', fn: () => { closePanel(); tryPlay(); } },
    { label: '↺ Réessayer', fn: () => startPlayer(PL.c, PL.i) },
    nextBtn(false), listBtn() ].filter(Boolean) });
}
function toggle() {
  if (V.paused) { const p = V.play(); if (p && p.catch) p.catch(() => {}); flash('▶'); } else { V.pause(); flash('⏸'); }
  showHud();
}
function seek(d) {
  if (!isFinite(V.duration)) return;
  V.currentTime = Math.max(0, Math.min(V.duration - 1, V.currentTime + d));
  flash((d < 0 ? '⏪ ' : '⏩ ') + Math.abs(d) + ' s'); showHud();
}
V.addEventListener('loadedmetadata', () => {
  const it = PL && COLS[PL.c].items[PL.i], r = it && PR[it.p];
  if (r && !r.v && r.t > 15 && r.t < V.duration - 20) { V.currentTime = r.t; flash('Reprise à ' + fmt(r.t)); }
});
V.addEventListener('playing', () => {
  waitEl.classList.remove('on'); showHud();
  if (!PL) return;
  PL.ok = true; const me = PL;
  setTimeout(() => { if (PL === me && !panelOpen && !V.paused && V.videoWidth === 0) showFail('Le son démarre mais pas l’image (codec vidéo non pris en charge ?).', true); }, 3000);
});
V.addEventListener('waiting', () => waitEl.classList.add('on'));
V.addEventListener('canplay', () => waitEl.classList.remove('on'));
V.addEventListener('pause', () => { if (!ended) showHud(); });
V.addEventListener('timeupdate', () => {
  if (!PL) return;
  const d = V.duration;
  if (isFinite(d) && d > 0) { $('#pbar i').style.width = (V.currentTime / d * 100) + '%'; $('#ptime').textContent = fmt(V.currentTime) + ' / ' + fmt(d); }
  if (Date.now() - lastSave > 5000) savePos();
});
V.addEventListener('ended', () => {
  if (!PL) return;
  ended = true;
  const it = COLS[PL.c].items[PL.i], d = Math.floor(V.duration) || 0;
  PR[it.p] = { t: d, d, u: Date.now(), v: true }; persist();
  showEnd();
});
V.addEventListener('error', () => { if (PL) showFail(); });

/* ---- Télécommande ---- */
function move(dir) {
  const root = panelOpen ? panelEl : app;
  const list = [...root.querySelectorAll('[data-f]')].filter(el => el.getClientRects().length);
  const a = document.activeElement;
  const cur = a && a.matches && a.matches('[data-f]') && root.contains(a) ? a : null;
  if (!cur) { focusEl(list[0], true); return; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bs = Infinity;
  for (const el of list) {
    if (el === cur) continue;
    const b = el.getBoundingClientRect(), dx = b.left + b.width / 2 - cx, dy = b.top + b.height / 2 - cy;
    let main, cross;
    if (dir === 'right') { if (dx <= 2) continue; main = dx; cross = Math.abs(dy); }
    else if (dir === 'left') { if (dx >= -2) continue; main = -dx; cross = Math.abs(dy); }
    else if (dir === 'down') { if (dy <= 2) continue; main = dy; cross = Math.abs(dx); }
    else { if (dy >= -2) continue; main = -dy; cross = Math.abs(dx); }
    const s = main + cross * 2.5;
    if (s < bs) { bs = s; best = el; }
  }
  if (best) focusEl(best, true);
}
function playerKey(e, k, kc) {
  e.preventDefault();
  if (k === 'Enter' || k === ' ' || k === 'MediaPlayPause' || k === 'MediaPlay' || k === 'MediaPause' || kc === 23) { if (!e.repeat) toggle(); }
  else if (k === 'ArrowLeft' || k === 'MediaRewind') seek(e.repeat ? -30 : -10);
  else if (k === 'ArrowRight' || k === 'MediaFastForward') seek(e.repeat ? 30 : 10);
  else if (k === 'ArrowUp' || k === 'ArrowDown' || k === 'ContextMenu') { if (!e.repeat) openMenu(); }
  else if (k === 'MediaTrackNext') goNext();
  else if (k === 'MediaTrackPrevious') goPrev();
  else if (k === 'MediaStop') back();
}
addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key, kc = e.keyCode;
  const isBack = k === 'Escape' || k === 'Backspace' || k === 'BrowserBack' || k === 'GoBack' || kc === 4 || kc === 461 || kc === 10009;
  if (isBack) {
    if (inPlayer && panelOpen && panelCfg && panelCfg.onBack) { e.preventDefault(); panelCfg.onBack(); }
    else if (inPlayer || cur.c != null) { e.preventDefault(); back(); }
    return;
  }
  if (inPlayer && !panelOpen) { if (/^(Arrow|Media|Enter| |ContextMenu)/.test(k) || kc === 23) playerKey(e, k, kc); return; }
  const dir = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[k];
  if (dir) { e.preventDefault(); move(dir); return; }
  if (k === 'PageDown' || kc === 34) { e.preventDefault(); for (let n = 0; n < 3; n++) move('down'); return; }
  if (k === 'PageUp' || kc === 33) { e.preventDefault(); for (let n = 0; n < 3; n++) move('up'); return; }
  if (k === 'Enter' || k === ' ' || kc === 23) {
    const a = document.activeElement;
    if (a && a.matches && a.matches('[data-f]')) { e.preventDefault(); if (!e.repeat) a.click(); }
  }
});
addEventListener('pagehide', savePos);

route();
})();
</script>
